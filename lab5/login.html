<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Вход | SimpleShop</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header id="main-header">
        <nav>
            <a href="index.html" class="nav-link">Главная</a>
            <a href="products.html" class="nav-link">Товары</a>
            <a href="contacts.html" class="nav-link">Контакты</a>
            <a href="login.html" class="nav-link">Вход</a>
            <a href="cart.html" class="nav-link">Корзина</a>
        </nav>
    </header>

    <div class="container">
            
        <h2>Вход в аккаунт</h2>

        <form class="login-form" id="login-form" novalidate>
            <label for="username">Логин:</label>
            <div style="width: 100%;">
                <input type="text" id="username" name="username">
                <div class="error-message" id="username-error">Логин должен быть не менее 4 символов.</div>
            </div>
            
            <label for="password">Пароль:</label>
            <div style="width: 100%;">
                <input type="password" id="password" name="password">
                <div class="error-message" id="password-error">Пароль должен быть не менее 8 символов.</div>
            </div>
            
            <div class="form-checkbox-group">
                <input type="checkbox" id="agreement" name="agreement">
                <label for="agreement">Я согласен на обработку данных</label>
            </div>
            <div class="error-message" id="agreement-error" style="grid-column: 1/-1; text-align: center;">
                Вы должны принять условия.
            </div>

            <button type="submit" class="submit-btn">Войти</button>
        </form>

        <div id="form-status" style="margin-top: 15px; font-weight: bold; text-align: center;"></div>

    </div>

    <footer id="footer">
        <p>2025</p>
    </footer>

    <script src="scripts.js" defer></script>

</body>
</html>
