<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Вход | SimpleShop</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header id="main-header">
        <nav>
            <a href="index.html" class="nav-link">Главная</a>
            <a href="products.html" class="nav-link">Товары</a>
            <a href="contacts.html" class="nav-link">Контакты</a>
            <a href="login.html" class="nav-link">Вход</a>
            <a href="cart.html" class="nav-link">Корзина</a>
        </nav>
    </header>

    <div class="container">
        <h2>Вход в аккаунт</h2>
        
        <form class="login-form" id="login-form">
            <label for="username">Логин:</label>
            <input type="text" id="username" name="username" required>
            
            <label for="password">Пароль:</label>
            <input type="password" id="password" name="password" required>
            
            <div class="form-checkbox-group">
                <input type="checkbox" id="agreement" name="agreement" required>
                <label for="agreement">Я согласен на обработку данных</label>
            </div>

            <button type="submit" class="submit-btn">Войти</button>
        </form>

    </div>

    <footer id="footer">
        <p>2025</p>
    </footer>

</body>
</html>
